apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 3                  # Pod 3개
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: 897722691159.dkr.ecr.ap-northeast-2.amazonaws.com/user73-webapp:e259bbc6113347c170bb24ccd230ccb6487cc639  # ★ 1단계 URI
          ports:
            - containerPort: 80


            